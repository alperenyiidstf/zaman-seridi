<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Çalışma Planı</title>
	<style>
		:root {
			--bg: #f6f5f2;
			--surface: #fff;
			--ink: #1d2321;
			--muted: #6b736f;
			--line: #dcdad3;
			--accent: #1f6f5c;
			--now: #e5322d
		}

		@media(prefers-color-scheme:dark) {
			:root {
				--bg: #161a19;
				--surface: #1f2423;
				--ink: #e8ece9;
				--muted: #8d9792;
				--line: #323938;
				--accent: #4fb89c
			}
		}

		* {
			box-sizing: border-box
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font: 15px/1.5 "Segoe UI", system-ui, sans-serif
		}

		main {
			max-width: 1800px;
			margin: 0 auto;
			padding: 28px 32px 60px
		}

		h1 {
			font-size: 26px;
			margin: 0 0 20px;
			font-weight: 650;
			letter-spacing: -.01em
		}

		.bar {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: center;
			margin-bottom: 14px
		}

		.seg {
			display: inline-flex;
			border: 1px solid var(--line);
			border-radius: 8px;
			overflow: hidden;
			background: var(--surface)
		}

		.seg button {
			border: 0;
			background: none;
			color: var(--ink);
			height: 38px;
			width: 96px;
			padding: 0;
			font: inherit;
			cursor: pointer;
			border-right: 1px solid var(--line)
		}

		.seg button:last-child {
			border-right: 0
		}

		.seg button.on {
			background: var(--accent);
			color: #fff
		}

		input,
		button {
			font: inherit;
			color: var(--ink)
		}

		input[type=text],
		input[type=date],
		input[type=number] {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 8px;
			height: 38px;
			padding: 0 10px;
			color-scheme: light dark
		}

		input[type=number] {
			width: 80px
		}

		input[type=color] {
			width: 42px;
			height: 38px;
			padding: 2px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--surface)
		}

		.range {
			color: var(--muted);
			margin-left: auto
		}

		.tl {
			position: relative;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 10px;
			overflow: hidden
		}

		#axis {
			position: relative;
			height: 28px;
			border-bottom: 1px solid var(--line)
		}

		#axis span {
			position: absolute;
			top: 5px;
			padding-left: 5px;
			font-size: 12px;
			color: var(--muted);
			white-space: nowrap
		}

		#track {
			position: relative;
			min-height: max(520px, 62vh)
		}

		.grid {
			position: absolute;
			top: 0;
			bottom: 0;
			border-left: 1px solid var(--line)
		}

		.blk {
			position: absolute;
			height: 30px;
			line-height: 30px;
			padding: 0 8px;
			border-radius: 6px;
			font-size: 13px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			cursor: pointer;
			min-width: 6px;
			box-shadow: 0 0 0 1px rgba(0, 0, 0, .12) inset
		}

		.blk.sel {
			outline: 2px solid var(--ink);
			outline-offset: 1px
		}

		.empty {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--muted)
		}

		#ph {
			position: absolute;
			top: 0;
			bottom: 0;
			width: 2px;
			margin-left: -1px;
			background: var(--now);
			pointer-events: none;
			z-index: 5
		}

		#ph::before {
			content: "";
			position: absolute;
			top: 0;
			left: -5px;
			border: 6px solid transparent;
			border-top: 8px solid var(--now);
			border-bottom: 0
		}

		form {
			margin-top: 22px;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 10px;
			padding: 16px;
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: end
		}

		label,
		.fld {
			display: flex;
			flex-direction: column;
			gap: 4px;
			font-size: 13px;
			color: var(--muted)
		}

		label.grow {
			flex: 1 1 220px
		}

		label.grow input {
			width: 100%
		}

		.btn {
			border: 1px solid var(--line);
			background: var(--surface);
			border-radius: 8px;
			height: 38px;
			width: 96px;
			padding: 0;
			cursor: pointer
		}

		.btn.main {
			background: var(--accent);
			border-color: var(--accent);
			color: #fff
		}

		.btn.del {
			color: var(--now)
		}

		.hide {
			display: none !important
		}
	</style>
</head>

<body>
	<main>
		<h1>Çalışma Planı</h1>
		<div class="bar">
			<div class="seg" id="modes">
				<button data-m="7">1 Hafta</button>
				<button data-m="m">1 Ay</button>
				<button data-m="y">1 Yıl</button>
				<button data-m="c">Özel</button>
			</div>
			<span id="custom" class="hide">
				<input type="date" id="from"> <input type="date" id="to">
			</span>
			<span class="range" id="rangeText"></span>
		</div>
		<div class="tl" id="tl">
			<div id="axis"></div>
			<div id="track"></div>
			<div id="ph"></div>
		</div>
		<form id="f">
			<label class="grow">Blok adı<input type="text" id="name" required></label>
			<label>Başlangıç<input type="date" id="start" required></label>
			<div class="fld">Uzunluk
				<div class="seg" id="units">
					<button type="button" data-u="d">Gün</button>
					<button type="button" data-u="w">Hafta</button>
					<button type="button" data-u="m">Ay</button>
					<button type="button" data-u="c">Özel</button>
				</div>
			</div>
			<label id="countWrap">Adet<input type="number" id="count" min="1" value="1"></label>
			<label id="endWrap" class="hide">Bitiş<input type="date" id="end"></label>
			<label>Renk<input type="color" id="color"></label>
			<button class="btn main" id="save">Ekle</button>
			<button type="button" class="btn del hide" id="del">Sil</button>
			<button type="button" class="btn hide" id="cancel">Vazgeç</button>
		</form>
	</main>
	<script>
		const $ = id => document.getElementById(id)
		const DAY = 864e5
		const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6']
		let blocks = JSON.parse(localStorage.getItem('blocks') || '[]')
		let range = JSON.parse(localStorage.getItem('range') || '{"mode":"7"}')
		let editId = null, unit = 'd'

		const midnight = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime() }
		const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime() }
		const fmt = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
		const show = t => new Date(t).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' })
		const lum = h => { const n = parseInt(h.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8 & 255) * 587) + (n & 255) * 114) / 1000 }
		const save = () => { localStorage.setItem('blocks', JSON.stringify(blocks)); localStorage.setItem('range', JSON.stringify(range)) }

		function getRange() {
			if (range.mode === 'c' && range.from && range.to && parse(range.to) >= parse(range.from)) return [parse(range.from), parse(range.to) + DAY]
			const s = midnight(Date.now()), d = new Date(s)
			if (range.mode === 'm') d.setMonth(d.getMonth() + 1)
			else if (range.mode === 'y') d.setFullYear(d.getFullYear() + 1)
			else d.setDate(d.getDate() + 7)
			return [s, d.getTime()]
		}

		function render() {
			const [rs, re] = getRange(), span = re - rs, pct = t => (t - rs) / span * 100
			document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === range.mode))
			$('custom').classList.toggle('hide', range.mode !== 'c')
			$('rangeText').textContent = show(rs) + ' – ' + show(re - DAY)

			const days = Math.round(span / DAY)
			const step = [1, 2, 7, 14, 30, 60, 90, 180, 365].find(s => days / s <= 14)
			const axis = $('axis'), track = $('track')
			axis.innerHTML = ''; track.innerHTML = ''
			for (let i = 0; i * step < days; i++) {
				const d = new Date(rs); d.setDate(d.getDate() + i * step)
				const left = pct(d.getTime()) + '%'
				const l = document.createElement('span'); l.style.left = left
				l.textContent = d.toLocaleDateString('tr-TR', days > 200 ? { day: 'numeric', month: 'short', year: '2-digit' } : { day: 'numeric', month: 'short' })
				axis.appendChild(l)
				const g = document.createElement('div'); g.className = 'grid'; g.style.left = left
				track.appendChild(g)
			}

			const vis = blocks.filter(b => parse(b.start) < re && parse(b.end) + DAY > rs).sort((a, b) => parse(a.start) - parse(b.start) || parse(a.end) - parse(b.end))
			const laneEnds = []
			vis.forEach(b => {
				const s = parse(b.start), e = parse(b.end) + DAY
				let lane = laneEnds.findIndex(x => x <= s)
				if (lane < 0) { lane = laneEnds.length; laneEnds.push(0) }
				laneEnds[lane] = e
				const cs = Math.max(s, rs), ce = Math.min(e, re)
				const el = document.createElement('div')
				el.className = 'blk' + (b.id === editId ? ' sel' : '')
				el.style.left = pct(cs) + '%'
				el.style.width = (pct(ce) - pct(cs)) + '%'
				el.style.top = (lane * 34 + 6) + 'px'
				el.style.background = b.color
				el.style.color = lum(b.color) > 150 ? '#111' : '#fff'
				el.textContent = b.name
				el.title = b.name + '\n' + show(s) + ' – ' + show(e - DAY)
				el.onclick = () => edit(b.id)
				track.appendChild(el)
			})
			track.style.height = Math.max(1, laneEnds.length) * 34 + 12 + 'px'
			if (!vis.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Bu aralıkta blok yok.'; track.appendChild(e) }
			tick()
		}

		function tick() {
			const [rs, re] = getRange(), p = (Date.now() - rs) / (re - rs)
			$('ph').style.display = p >= 0 && p <= 1 ? 'block' : 'none'
			$('ph').style.left = p * 100 + '%'
		}

		function calcEnd() {
			if (unit === 'c') return $('end').value
			const n = Math.max(1, parseInt($('count').value) || 1), d = new Date(parse($('start').value))
			if (unit === 'd') d.setDate(d.getDate() + n - 1)
			else if (unit === 'w') d.setDate(d.getDate() + n * 7 - 1)
			else { d.setMonth(d.getMonth() + n); d.setDate(d.getDate() - 1) }
			return fmt(d.getTime())
		}

		function setUnit(u) {
			unit = u
			document.querySelectorAll('#units button').forEach(b => b.classList.toggle('on', b.dataset.u === u))
			$('countWrap').classList.toggle('hide', u === 'c')
			$('endWrap').classList.toggle('hide', u !== 'c')
		}

		function resetForm() {
			editId = null
			const t = fmt(Date.now())
			$('name').value = ''; $('start').value = t; $('end').value = t; $('count').value = 1; setUnit('d')
			$('color').value = COLORS[blocks.length % COLORS.length]
			$('save').textContent = 'Ekle'
			$('del').classList.add('hide'); $('cancel').classList.add('hide')
		}

		function edit(id) {
			const b = blocks.find(x => x.id === id)
			editId = id
			$('name').value = b.name; $('start').value = b.start; $('end').value = b.end; $('color').value = b.color; setUnit('c')
			$('save').textContent = 'Güncelle'
			$('del').classList.remove('hide'); $('cancel').classList.remove('hide')
			render()
			$('name').focus()
		}

		$('f').onsubmit = e => {
			e.preventDefault()
			const s = $('start').value
			let en = calcEnd() || s
			if (parse(en) < parse(s)) en = s
			const data = { name: $('name').value.trim(), start: s, end: en, color: $('color').value }
			if (editId) Object.assign(blocks.find(x => x.id === editId), data)
			else blocks.push({ id: Date.now().toString(36), ...data })
			save(); resetForm(); render()
		}
		$('del').onclick = () => { blocks = blocks.filter(x => x.id !== editId); save(); resetForm(); render() }
		$('cancel').onclick = () => { resetForm(); render() }
		document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { range.mode = b.dataset.m; save(); render() })
		document.querySelectorAll('#units button').forEach(b => b.onclick = () => setUnit(b.dataset.u))
		$('from').onchange = () => { range.from = $('from').value; save(); render() }
		$('to').onchange = () => { range.to = $('to').value; save(); render() }

		$('from').value = range.from || fmt(Date.now())
		$('to').value = range.to || fmt(Date.now() + 30 * DAY)
		range.from = $('from').value; range.to = $('to').value
		resetForm(); render()
		setInterval(render, 30000)
	</script>
</body>

</html>
